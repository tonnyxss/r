<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonny TV</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .player-wrapper {
            position: relative;
            width: 90vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 2px solid #222;
            z-index: 1;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Tela preta inicial por 2s no YouTube */
        .youtube-black-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 50;
            opacity: 1;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        .youtube-black-screen.hidden {
            opacity: 0;
        }
        .youtube-cover {
            position: absolute;
            inset: 0;
            background: transparent;
            z-index: 3;
            pointer-events: auto;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 4;
        }
        .player-wrapper:hover .overlay,
        .overlay:hover {
            opacity: 1;
            pointer-events: all;
        }
        .custom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .overlay.youtube-hidden {
            display: none !important;
        }
        button {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(0, 255, 136, 0.6);
            transform: scale(1.1);
        }
        select {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]:hover {
            background: rgba(0, 255, 136, 0.3);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }
        .status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #555;
            z-index: 10;
        }
        /* Central Icons - Layout lado a lado */
        .center-icons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        .center-icon {
            font-size: 80px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .center-icon:hover {
            color: #00ff88;
            transform: scale(1.1);
        }
        .center-icon.hidden {
            display: none;
        }
        
        #reload-btn { font-size: 18px; }
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 30;
            background: rgba(0, 0, 0, 0.7);
            font-size: 22px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            backdrop-filter: blur(5px);
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -200px;
            width: 180px;
            height: 100vh;
            background: #0a0a0a;
            transition: left 0.4s ease;
            z-index: 25;
            padding: 80px 10px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 1px solid #222;
        }
        .sidebar.open { left: 0; }
        .sidebar h2 {
            color: #00ff88;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        /* ESTILO NOVO PARA AS CATEGORIAS */
        .category-title {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 5px;
            padding-left: 5px;
            border-bottom: 1px solid #222;
            font-weight: bold;
        }
        
        .channel-list { list-style: none; padding: 0; }
        .channel-list li {
            padding: 2px 2px;
            color: #ccc;
            cursor: pointer;
            border-radius: 3px;
            margin-bottom: 3px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .channel-list li:hover { background: #1a1a1a; color: white; }
        .channel-list li.active {
            background: #003322;
            color: #00ff88;
            font-weight: bold;
            border-left: 2px solid #00ff88;
        }
        @media (max-width: 768px) {
            .player-wrapper { width: 95vw; }
            .menu-btn { top: 10px; left: 10px; width: 40px; height: 40px; font-size: 20px; }
            .sidebar { width: 160px; left: -180px; }
            .center-icon { font-size: 60px; }
            .center-icons { gap: 40px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <button class="menu-btn" id="menu-btn">☰</button>
    <div class="sidebar" id="sidebar">
        <h2>Canais</h2>
        <ul class="channel-list" id="channel-list"></ul>
    </div>
    <div class="player-wrapper">
        <div class="player-container" id="player-container">
            <video id="video" autoplay muted playsinline></video>
            <div class="youtube-black-screen hidden" id="youtube-black-screen"></div>
            <div class="youtube-cover hidden" id="youtube-cover"></div>
        </div>
        <div class="status" id="status">Carregando...</div>
        
        <div class="center-icons" id="center-icons">
            <div class="center-icon hidden" id="mute-icon" title="Clique para ativar o som">🔇</div>
            <div class="center-icon hidden" id="reload-center" title="Recarregar canal">🔄</div>
        </div>

        <div class="overlay" id="overlay">
            <div class="custom-controls">
                <div class="volume-container">
                    <button id="volume-btn" title="Ativar som">🔇</button>
                    <input type="range" id="volume-slider" min="0" max="100" value="0">
                </div>
                <button id="reload-btn" title="Atualizar canal">🔄</button>
                <select id="quality-selector" style="display:none;">
                    <option value="-1">Auto</option>
                </select>
                <button id="fullscreen-btn" title="Tela Cheia">⛶</button>
            </div>
        </div>
    </div>

    <script>
        const playerContainer = document.getElementById('player-container');
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');
        const muteIcon = document.getElementById('mute-icon');
        const reloadCenter = document.getElementById('reload-center');
        const reloadBtn = document.getElementById('reload-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const qualitySelect = document.getElementById('quality-selector');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const channelList = document.getElementById('channel-list');

        let hls;
        let currentUrl = ''; 
        let isYouTube = false;

        // NOVA ESTRUTURA DE CANAIS POR CATEGORIA
        const channelGroups = [
            {
                category: "TV Aberta",
                items: [
                    { name: 'Record News', url: 'https://stream.ads.ottera.tv/playlist.m3u8?network_id=2116' },
                    { name: 'SBT', url: 'https://cdn.jmvstream.com/w/LVW-10801/LVW10801_Xvg4R0u57n/playlist.m3u8' },
                    { name: 'Rede TV', url: 'https://evp.mm.uol.com.br:1935/redetv1/redetv1/playlist.m3u8' }
                ]
            },
            {
                category: "Desenho Animado",
                items: [
                    { name: 'Nickelodeon', url: 'http://45.235.0.78/Nickelodeon/playlist.m3u8' },
                    { name: 'Pica-Pau TV', url: 'https://www.youtube.com/watch?v=g-wtiZlKQ54' },
                    { name: 'Relax TV', url: 'https://www.youtube.com/watch?v=dXIyMS61B68' }
                ]
            },
            {
                category: "Outros",
                items: [
                    { name: 'Relax TV', url: 'https://www.youtube.com/watch?v=dXIyMS61B68' }
                ]
            },
            {
                category: "Testando Canais",
                items: [
                    { name: 'Premiere 01 (Offline)', url: '' },

                ]
            }
        ];

        // Geração da lista com Categorias
        let firstChannelSet = false;

        channelGroups.forEach(group => {
            // Cria o título da categoria
            const title = document.createElement('div');
            title.className = 'category-title';
            title.textContent = group.category;
            channelList.appendChild(title);

            // Cria os canais da categoria
            group.items.forEach(channel => {
                const li = document.createElement('li');
                li.textContent = channel.name;
                li.dataset.url = channel.url;
                
                // Define o primeiro canal de todos como o inicial
                if (!firstChannelSet) {
                    li.classList.add('active');
                    currentUrl = channel.url;
                    firstChannelSet = true;
                }

                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    changeChannel(channel.url, li);
                });
                channelList.appendChild(li);
            });
        });

        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function reloadCurrentChannel() {
            const activeLi = document.querySelector('.channel-list li.active');
            if (activeLi) {
                changeChannel(currentUrl, activeLi);
            }
        }

        reloadBtn.addEventListener('click', reloadCurrentChannel);
        reloadCenter.addEventListener('click', reloadCurrentChannel);

        muteIcon.addEventListener('click', () => {
            if (!isYouTube) {
                const video = playerContainer.querySelector('video');
                if (video) {
                    video.muted = false;
                    video.volume = 1.0;
                    volumeSlider.value = 100;
                    volumeBtn.textContent = '🔊';
                    muteIcon.classList.add('hidden'); 
                }
            }
        });

        function changeChannel(newUrl, selectedLi) {
            if (newUrl === currentUrl && hls && hls.media) {
                sidebar.classList.remove('open');
                return;
            }

            currentUrl = newUrl;
            document.querySelectorAll('.channel-list li').forEach(li => li.classList.remove('active'));
            selectedLi.classList.add('active');

            status.textContent = 'Carregando...';
            status.style.display = 'block';
            
            reloadCenter.classList.add('hidden');
            muteIcon.classList.add('hidden'); 

            playerContainer.innerHTML = ''; 

            const youtubeID = getYouTubeID(newUrl);

            if (youtubeID) {
                isYouTube = true;
                overlay.classList.add('youtube-hidden');

                const embedUrl = `https://www.youtube-nocookie.com/embed/${youtubeID}?autoplay=1&mute=0&playsinline=1&rel=0&controls=0&modestbranding=1&iv_load_policy=3&fs=0`;
                
                playerContainer.innerHTML = `
                    <iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>
                    <div class="youtube-cover"></div>
                    <div class="youtube-black-screen" id="yt-screen-temp"></div>
                `;

                const currentBlackScreen = document.getElementById('yt-screen-temp');
                setTimeout(() => {
                    if (currentBlackScreen) currentBlackScreen.classList.add('hidden');
                }, 3500);

                status.style.display = 'none';
            } else {
                isYouTube = false;
                overlay.classList.remove('youtube-hidden');

                playerContainer.innerHTML = `
                    <video id="video" autoplay muted playsinline></video>
                    <div class="youtube-black-screen hidden"></div>
                    <div class="youtube-cover hidden"></div>
                `;
                
                const video = playerContainer.querySelector('video');

                muteIcon.classList.remove('hidden');
                volumeBtn.textContent = '🔇';
                volumeSlider.value = 0;

                if (hls) hls.destroy();

                const loadTimeout = setTimeout(() => {
                    reloadCenter.classList.remove('hidden');
                }, 8000);

                if (Hls.isSupported()) {
                    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hls.loadSource(newUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        clearTimeout(loadTimeout);
                        video.play().catch(() => {
                            reloadCenter.classList.remove('hidden');
                        });
                        status.style.display = 'none';
                        reloadCenter.classList.add('hidden');
                        updateQualityOptions();
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        clearTimeout(loadTimeout);
                        if (data.fatal) {
                            status.textContent = 'Erro na conexão';
                            status.style.display = 'block';
                            reloadCenter.classList.remove('hidden'); 
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = newUrl;
                    video.addEventListener('loadedmetadata', () => {
                        clearTimeout(loadTimeout);
                        video.play();
                        status.style.display = 'none';
                        reloadCenter.classList.add('hidden');
                    }, { once: true });
                    
                    video.addEventListener('error', () => {
                        reloadCenter.classList.remove('hidden');
                    });
                }
            }
            sidebar.classList.remove('open');
        }

        function updateQualityOptions() {
            qualitySelect.innerHTML = '<option value="-1">Auto</option>';
            qualitySelect.style.display = 'none';
            if (hls && hls.levels.length > 1) {
                qualitySelect.style.display = 'block';
                hls.levels.forEach((level, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = level.height ? `${level.height}p` : 'Auto';
                    qualitySelect.appendChild(option);
                });
                qualitySelect.value = hls.currentLevel;
            }
        }

        window.onload = () => {
            changeChannel(currentUrl, channelList.querySelector('li'));
        };

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            if (!isYouTube) {
                const video = playerContainer.querySelector('video');
                if (video) {
                    const vol = e.target.value / 100;
                    video.volume = vol;
                    
                    if (vol > 0) {
                        video.muted = false;
                        muteIcon.classList.add('hidden'); 
                        volumeBtn.textContent = '🔊';
                    } else {
                        video.muted = true;
                        muteIcon.classList.remove('hidden'); 
                        volumeBtn.textContent = '🔇';
                    }
                }
            }
        });

        volumeBtn.addEventListener('click', () => {
            if (!isYouTube) {
                const video = playerContainer.querySelector('video');
                if (video) {
                    video.muted = !video.muted;
                    
                    if (video.muted) {
                        video.volume = 0.0;
                        volumeSlider.value = 0;
                        volumeBtn.textContent = '🔇';
                        muteIcon.classList.remove('hidden'); 
                    } else {
                        video.volume = 1.0;
                        volumeSlider.value = 100;
                        volumeBtn.textContent = '🔊';
                        muteIcon.classList.add('hidden'); 
                    }
                }
            }
        });

        fullscreenBtn.addEventListener('click', () => {
            const wrapper = document.querySelector('.player-wrapper');
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        });

        qualitySelect.addEventListener('change', (e) => {
            if (hls) hls.currentLevel = parseInt(e.target.value);
        });

        playerContainer.addEventListener('dblclick', (e) => {
             if(e.target.tagName === 'VIDEO') fullscreenBtn.click();
        });
    </script>
</body>
</html>
