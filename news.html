<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonio - Anti JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        #antonio-content {
            height: calc(100vh - 4.5rem); /* Ajustado para a barra */
            margin-top: 4.5rem; /* Ajustado para a barra */
            padding: 0.5rem;
        }
        #antonio-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #antonio-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #dedede;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        #antonio-bar label {
            font-weight: 600;
            color: #374151;
        }
        #antonio-bar input {
            flex: 1 1 0%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            outline: none;
        }
        #antonio-bar input:focus {
            box-shadow: 0 0 0 2px #6b7280;
        }
        .custom-button {
            background-color: #adadad;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
        }
        .custom-button:hover {
            background-color: #808080;
        }
        @media (max-width: 640px) {
            #antonio-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.5rem;
                height: auto;
            }
            #antonio-content {
                height: calc(100vh - 9rem);
                margin-top: 9rem;
            }
            #antonio-bar > * {
                margin-bottom: 0.5rem;
            }
        }

        /* Mensagens */
        #antonio-message {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            color: #ffffff;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 1000;
            font-weight: bold;
            transform: translateY(20px);
        }
        #antonio-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .antonio-success {
            background-color: #28a745;
        }
        .antonio-error {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div id="antonio-bar">
        <label for="antonio_url">Digite a URL:</label>
        <input type="text" id="antonio_url" placeholder="https://exemplo.com">
        <button onclick="carregarPagina()" class="custom-button">Carregar</button>
        <button onclick="recarregar()" class="custom-button">Atualizar</button>
        <button onclick="copiarURL()" class="custom-button">Copiar URL</button>
        <button onclick="limpar()" class="custom-button">Limpar</button>
    </div>
    <div id="antonio-content">
        <iframe id="antonio-frame" sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation" class="w-full h-full"></iframe>
    </div>
    <div id="antonio-message"></div>

    <script Language='Javascript'>document.write(unescape('%3C%73%63%72%69%70%74%20%73%72%63%3D%22%6E%65%77%73%2E%6A%73%22%3E%3C%2F%73%63%72%69%70%74%3E'));</script>
</body>
</html>
