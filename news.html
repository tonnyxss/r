<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonnyNews ~ Anti JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #content { height: calc(100vh - 4rem); }
    </style>
</head>
<body class="bg-gray-100">
    <div id="top-bar" class="fixed top-0 left-0 w-full bg-white shadow-lg p-4 z-10 flex items-center space-x-4">
        <label for="tonny_url" class="text-gray-700 font-semibold">Digite a URL:</label>
        <input type="text" id="tonny_url" placeholder="https://exemplo.com/noticia" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500">
        <button onclick="carregarPagina()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition">Carregar</button>
        <button onclick="recarregar()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition">Atualizar</button>
        <button onclick="copiarURL()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition">Copiar URL</button>
        <button onclick="limpar()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition">Limpar</button>
    </div>
    <div id="content" class="mt-16 p-6 overflow-auto">
        <iframe id="frame" sandbox="" class="w-full h-full"></iframe>
    </div>
    <script>
        let currentURL = ''; // URL original da notícia
        let shareLink = ''; // Link compartilhável com ?id=

        function carregarPagina() {
            const url = document.getElementById('tonny_url').value.trim();
            if (!url) {
                alert('Por favor, digite um URL válido.');
                return;
            }
            const encoded = btoa(url); // Codifica a URL em Base64
            currentURL = url;
            shareLink = `${window.location.origin}${window.location.pathname}?id=${encoded}`;
            document.getElementById('frame').src = url;
            window.history.pushState({ encoded }, '', `?id=${encoded}`); // Muda a URL do navegador para ?id=<base64>
        }

        function recarregar() {
            if (currentURL) {
                document.getElementById('tonny_url').value = currentURL;
                carregarPagina();
            }
        }

        function copiarURL() {
            if (shareLink) {
                navigator.clipboard.writeText(shareLink).then(() => alert('Link copiado!'));
            } else {
                alert('Nenhuma URL carregada.');
            }
        }

        function limpar() {
            document.getElementById('tonny_url').value = '';
            document.getElementById('frame').src = 'about:blank';
            currentURL = '';
            shareLink = '';
            window.history.pushState({}, '', window.location.pathname); // Reseta a URL do navegador
        }

        // Carrega URL da query string, se presente
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('id');
            if (encoded) {
                try {
                    const url = atob(encoded); // Decodifica a URL
                    document.getElementById('tonny_url').value = url;
                    currentURL = url;
                    shareLink = `${window.location.origin}${window.location.pathname}?id=${encoded}`;
                    document.getElementById('frame').src = url;
                    window.history.pushState({ encoded }, '', `?id=${encoded}`); // Mantém a URL do navegador com ?id=<base64>
                } catch (error) {
                    alert('ID inválido ou URL não encontrada.');
                }
            }
        };
    </script>
</body>
</html>
