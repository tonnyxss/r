<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonny TV</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .player-wrapper {
            position: relative;
            width: 90vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 2px solid #222;
            z-index: 1;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tela preta para YouTube - Ajustada */
        .youtube-black-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 99; /* Garante que fica em cima de tudo dentro do player */
            opacity: 1;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        .youtube-black-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .youtube-cover {
            position: absolute;
            inset: 0;
            background: transparent;
            z-index: 10;
            pointer-events: auto;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .player-wrapper:hover .overlay {
            opacity: 1;
            pointer-events: all;
        }
        .custom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .overlay.youtube-hidden {
            display: none !important;
        }
        button {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(0, 255, 136, 0.6);
            transform: scale(1.1);
        }
        select {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        .status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #555;
            z-index: 30;
        }
        .center-icons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 60px;
            z-index: 30;
            pointer-events: none;
        }
        .center-icon {
            font-size: 80px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: auto;
        }
        .center-icon.hidden { display: none; }
        
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -200px;
            width: 180px;
            height: 100vh;
            background: #0a0a0a;
            transition: left 0.4s ease;
            z-index: 90;
            padding: 80px 10px 20px;
            overflow-y: auto;
            border-right: 1px solid #222;
        }
        .sidebar.open { left: 0; }
        .channel-list { list-style: none; padding: 0; }
        .channel-list li {
            padding: 10px;
            color: #ccc;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .channel-list li.active { background: #003322; color: #00ff88; }
    </style>
</head>
<body>
    <button class="menu-btn" id="menu-btn">☰</button>
    <div class="sidebar" id="sidebar">
        <h2 style="color: #00ff88; text-align: center;">Canais</h2>
        <ul class="channel-list" id="channel-list"></ul>
    </div>

    <div class="player-wrapper">
        <div class="player-container" id="player-container">
            </div>
        <div class="status" id="status">Carregando...</div>
        <div class="center-icons" id="center-icons">
            <div class="center-icon hidden" id="mute-icon">控制</div>
            <div class="center-icon hidden" id="reload-center">🔄</div>
        </div>
        <div class="overlay" id="overlay">
            <div class="custom-controls">
                <div class="volume-container">
                    <button id="volume-btn">🔇</button>
                    <input type="range" id="volume-slider" min="0" max="100" value="0">
                </div>
                <button id="reload-btn">🔄</button>
                <select id="quality-selector" style="display:none;"></select>
                <button id="fullscreen-btn">⛶</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const playerContainer = document.getElementById('player-container');
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');
        const reloadCenter = document.getElementById('reload-center');
        const reloadBtn = document.getElementById('reload-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const qualitySelect = document.getElementById('quality-selector');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const channelList = document.getElementById('channel-list');

        let hls;
        let currentUrl = 'https://stream.ads.ottera.tv/playlist.m3u8?network_id=2116';
        let isYouTube = false;

        const channels = [
            { name: 'Record News', url: 'https://stream.ads.ottera.tv/playlist.m3u8?network_id=2116' },
            { name: 'SBT', url: 'https://cdn.jmvstream.com/w/LVW-10801/LVW10801_Xvg4R0u57n/playlist.m3u8' },
            { name: 'Rede TV', url: 'https://evp.mm.uol.com.br:1935/redetv1/redetv1/playlist.m3u8' },
            { name: 'Nickelodeon', url: 'http://45.235.0.78/Nickelodeon/playlist.m3u8' },
            { name: 'Pica-Pau TV', url: 'https://www.youtube.com/watch?v=g-wtiZlKQ54' }
        ];

        channels.forEach((channel, index) => {
            const li = document.createElement('li');
            li.textContent = channel.name;
            li.addEventListener('click', () => changeChannel(channel.url, li));
            channelList.appendChild(li);
            if (index === 0) li.classList.add('active');
        });

        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function changeChannel(newUrl, selectedLi) {
            currentUrl = newUrl;
            document.querySelectorAll('.channel-list li').forEach(li => li.classList.remove('active'));
            selectedLi.classList.add('active');
            sidebar.classList.remove('open');

            status.textContent = 'Carregando...';
            status.style.display = 'block';
            reloadCenter.classList.add('hidden');

            const youtubeID = getYouTubeID(newUrl);

            if (youtubeID) {
                isYouTube = true;
                overlay.classList.add('youtube-hidden');
                
                // Injeta Iframe + Capa + TELA PRETA
                playerContainer.innerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/${youtubeID}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                    <div class="youtube-cover"></div>
                    <div class="youtube-black-screen" id="yt-black"></div>
                `;

                // Faz a tela preta sumir após 2 segundos
                setTimeout(() => {
                    const blackDiv = document.getElementById('yt-black');
                    if (blackDiv) blackDiv.classList.add('hidden');
                }, 2000);

                status.style.display = 'none';
            } else {
                isYouTube = false;
                overlay.classList.remove('youtube-hidden');
                playerContainer.innerHTML = '<video id="video" autoplay muted playsinline></video>';
                const video = document.getElementById('video');

                if (hls) hls.destroy();

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(newUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play();
                        status.style.display = 'none';
                    });
                }
            }
        }

        menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
        reloadBtn.addEventListener('click', () => changeChannel(currentUrl, document.querySelector('.channel-list li.active')));
        
        fullscreenBtn.addEventListener('click', () => {
            const wrapper = document.querySelector('.player-wrapper');
            if (!document.fullscreenElement) wrapper.requestFullscreen?.();
            else document.exitFullscreen?.();
        });

        window.onload = () => changeChannel(currentUrl, channelList.querySelector('li'));
    </script>
</body>
</html>
