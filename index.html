<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foco Legis - Lei Seca Comentada e Esquematizada!</title>
    <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1974259026792087');
    </script>
</head>
<body>
    <script>
        let visitorId = localStorage.getItem('fl_visitor_id');
        if (!visitorId) {
            visitorId = 'V-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('fl_visitor_id', visitorId);
        }
        window.visitorId = visitorId;
        window.scriptURL = 'https://script.google.com/macros/s/AKfycbyRkjc2Th75EV1ah4qjlVAphce_TyvG268aXtMRwBQqiV3G6XU1Hc9tOEmBbw_9k4AAVw/exec'; 

        (function() {
            let urlParams = new URLSearchParams(window.location.search);
            let utmsUrl = window.location.search || "Orgânico/Direto";

            let ua = navigator.userAgent;
            let deviceType = /Mobile|Android|iP(hone|od|ad)/i.test(ua) ? "Celular" : "PC";
            let osType = "Outro";
            if (/Android/i.test(ua)) osType = "Android";
            else if (/iP(hone|od|ad)/i.test(ua)) osType = "iOS";
            else if (/Windows/i.test(ua)) osType = "Windows";

            fbq('track', 'PageView');

            let payloadAcesso = { 
                "type": "ip", "visitorId": window.visitorId, "ip": "Oculto",
                "estado": "-", "cidade": "-", "url": "INDEX", 
                "utm": utmsUrl, "device": deviceType, "os": osType
            };

            function enviarParaPlanilha(p) {
                fetch(window.scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            }

            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(ipData => {
                    payloadAcesso.ip = ipData.ip;
                    return fetch('https://ipwhois.app/json/' + ipData.ip);
                })
                .then(res => res.json())
                .then(geo => {
                    payloadAcesso.estado = geo.region || "-";
                    payloadAcesso.cidade = geo.city || "-";
                    enviarParaPlanilha(payloadAcesso);
                })
                .catch(() => enviarParaPlanilha(payloadAcesso));
                
            // RASTREIO DE ROLAGEM
            let scrollMarks = { 25: false, 50: false, 75: false, 100: false };
            window.addEventListener('scroll', () => {
                let scrollPercent = Math.round((window.scrollY / (document.body.offsetHeight - window.innerHeight)) * 100);
                [25, 50, 75, 100].forEach(mark => {
                    if (scrollPercent >= mark && !scrollMarks[mark]) {
                        scrollMarks[mark] = true;
                        fetch(window.scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ "type": "scroll", "visitorId": window.visitorId, "depth": mark + "%" }) });
                    }
                });
            });
        })();

        // LOGICA DOS BOTÕES E MODAL
        document.addEventListener("DOMContentLoaded", function() {
            function registrarAcao(tipo, extra) {
                let p = { "type": tipo, "visitorId": window.visitorId };
                if (extra.produto) p.produto = extra.produto;
                if (extra.whatsapp) p.whatsapp = extra.whatsapp;
                fetch(window.scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            }

            document.querySelectorAll('.btn-comprar').forEach(btn => {
                btn.addEventListener('click', () => {
                    let nome = btn.closest('.card').querySelector('h3').innerText;
                    fbq('track', 'InitiateCheckout', { content_name: nome, value: 19.99, currency: 'BRL' });
                    registrarAcao("checkout", { produto: nome });
                });
            });

            document.querySelectorAll('.btn-amostra').forEach(btn => {
                btn.addEventListener('click', () => {
                    let nome = btn.closest('.card').querySelector('h3').innerText;
                    fbq('track', 'ViewContent', { content_name: nome });
                    registrarAcao("amostra", { produto: nome });
                });
            });

            const form = document.getElementById('whatsapp-form');
            if(form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    let whats = document.getElementById('whatsapp-input').value;
                    if(whats.length >= 10) {
                        registrarAcao("whatsapp", { whatsapp: whats });
                        fbq('track', 'Lead', { content_name: 'Resumão Ética' });
                        form.style.display = 'none';
                        document.getElementById('modal-text').innerHTML = "✅ Acesso Liberado! Clique abaixo.";
                        document.getElementById('link-real').style.display = 'block';
                    }
                });
            }
            
            // Timer e abertura do modal mantidos como você já tem...
            let timeLeft = 10;
            const timer = setInterval(() => {
                let btn = document.getElementById('btn-timer');
                timeLeft--;
                if (timeLeft > 0) { btn.innerText = `AGUARDE ${timeLeft}s...`; } 
                else { clearInterval(timer); btn.innerText = 'BAIXAR MATERIAL'; btn.classList.remove('disabled'); }
            }, 1000);

            document.getElementById('btn-timer').addEventListener('click', function() {
                if (!this.classList.contains('disabled')) document.getElementById('modal').style.display = 'flex';
            });
            
            document.getElementById('link-real').addEventListener('click', () => {
                document.getElementById('modal').style.display = 'none';
            });
        });
    </script>
</body>
</html>
