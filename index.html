<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foco Legis - Lei Seca Comentada!</title>
    
    <!-- Pixel da Meta -->
    <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1974259026792087');

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #1a252f; color: #ffffff; text-align: center; padding: 40px 20px; }
        header h1 { margin: 0; font-size: 2.2em; color: #f1c40f; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 25px; text-align: center; display: flex; flex-direction: column; }
        .card img { width: 150px; margin: 0 auto 15px auto; border-radius: 8px; }
        .preco-antigo { color: #e74c3c; text-decoration: line-through; font-weight: bold; margin-bottom: 5px; display: block; }
        .preco-novo { color: #27ae60; font-size: 1.6em; font-weight: bold; margin-bottom: 15px; display: block; }
        .btn-comprar { background-color: #27ae60; color: white; padding: 12px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; display: block; }
        .btn-amostra { border: 2px solid #34495e; color: #34495e; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; display: block; margin-top: 5px; }
        .btn-download { background-color: #27ae60; color: white; padding: 12px; border-radius: 5px; width: 100%; border: none; cursor: pointer; font-weight: bold; }
        .btn-download.disabled { background-color: #ccc; cursor: not-allowed; }
        /* WhatsApp Fixo */
        .wa-fixo { position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; text-decoration: none; z-index: 1000; }
        .wa-balao { background: white; color: #2c3e50; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.85em; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-right: 10px; }
        .wa-icon { width: 60px; height: 60px; background-color: #25d366; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header><h1>Foco Legis</h1></header>

    <div class="container">
        <div class="grid-produtos">
            <div class="card">
                <img src="OAB.png">
                <h3>Resumão Ética - OAB 46</h3>
                <span class="preco-antigo">R$ 19,99</span>
                <span class="preco-novo">R$ 0,00</span>
                <button class="btn-download disabled" id="btn-timer">AGUARDE 10s...</button>
            </div>
            <!-- Outros produtos -->
        </div>
    </div>

    <!-- Modal WhatsApp -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:2000;">
        <div style="background:white; padding:30px; border-radius:10px; text-align:center; width:90%; max-width:400px;">
            <h3>Informe seu WhatsApp</h3>
            <form id="whatsapp-form">
                <input type="tel" id="whatsapp-input" placeholder="(00) 90000-0000" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;" required>
                <button type="submit" class="btn-download">LIBERAR PDF</button>
            </form>
            <a href="OAB46.pdf" id="link-real" class="btn-download" style="display:none; text-decoration:none;">BAIXAR AGORA</a>
        </div>
    </div>

    <a href="https://wa.me/5522998223640" class="wa-fixo" target="_blank">
        <div class="wa-balao">DÚVIDAS? CHAME NO WHATSAPP!</div>
        <div class="wa-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35"></div>
    </a>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyPLXPNiYFBRFt7pIsLrz8SOE024S8sGeiH-wX7gMbeClhTTychntfgCPVuBwKK40JNWQ/exec';
    window.currentLoc = { ip: "", estado: "", cidade: "" };

    function enviarParaPlanilha(dados) {
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
            ip: window.currentLoc.ip, estado: window.currentLoc.estado, cidade: window.currentLoc.cidade,
            device: /Mobile/i.test(navigator.userAgent) ? "Celular" : "PC",
            os: /Android/i.test(navigator.userAgent) ? "Android" : (/iPhone/i.test(navigator.userAgent) ? "iOS" : "Computador"),
            utm: window.location.search || "Orgânico/Direto", ...dados
        })});
    }

    // Localização
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(ipD => {
        fetch('https://ipapi.co/' + ipD.ip + '/json/').then(r => r.json()).then(geo => {
            window.currentLoc = { ip: ipD.ip, estado: geo.region, cidade: geo.city };
            enviarParaPlanilha({ type: "ip" });
            if (typeof fbq === 'function') fbq('track', 'PageView');
        });
    }).catch(() => enviarParaPlanilha({ type: "ip" }));

    // Scroll e Cliques
    let marks = { 25: false, 50: false, 75: false, 100: false };
    window.onscroll = () => {
        let p = Math.round((window.scrollY / (document.body.offsetHeight - window.innerHeight)) * 100);
        [25, 50, 75, 100].forEach(m => {
            if (p >= m && !marks[m]) { marks[m] = true; enviarParaPlanilha({ type: "scroll", depth: m + "%" }); }
        });
    };

    document.getElementById('btn-timer').onclick = function() {
        if(!this.classList.contains('disabled')) document.getElementById('modal').style.display = 'flex';
    };

    let sec = 10;
    const t = setInterval(() => {
        sec--; document.getElementById('btn-timer').innerText = sec > 0 ? `AGUARDE ${sec}s...` : 'BAIXAR AGORA';
        if(sec <= 0) { clearInterval(t); document.getElementById('btn-timer').classList.remove('disabled'); }
    }, 1000);

    document.getElementById('whatsapp-form').onsubmit = function(e) {
        e.preventDefault();
        enviarParaPlanilha({ type: "whatsapp", whatsapp: document.getElementById('whatsapp-input').value });
        this.style.display = 'none'; document.getElementById('link-real').style.display = 'block';
        if (typeof fbq === 'function') fbq('track', 'Lead');
    };
</script>
</body>
</html>
