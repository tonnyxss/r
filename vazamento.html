<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Senhas</title>
  <style>
    /* Estilos Gerais do Corpo da Página */
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: #333333; /* Cinza escuro para o fundo principal */
      color: #add8e6; /* Azul claro para o texto principal */
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Esconde a barra de rolagem para navegadores baseados em WebKit (Chrome, Safari) */
      -ms-overflow-style: none;  /* Esconde a barra de rolagem para IE e Edge */
      scrollbar-width: none;  /* Esconde a barra de rolagem para Firefox */
    }

    /* Esconde a barra de rolagem para navegadores baseados em WebKit (Chrome, Safari) */
    body::-webkit-scrollbar {
      display: none;
    }

    /* Tela de Carregamento */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2; /* Cinza escuro para o fundo da tela de carregamento */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .loading p {
      font-size: 1.2rem;
      color: #add8e6; /* Azul claro para o texto de carregamento */
    }

    /* Cabeçalho */
    .cabecalho {
      background: #111111;
      padding: 0.75rem;
      border-bottom: 1px solid black;
      display: flex;
      gap: 1rem;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 15;
      color: #d3d3d3;
    }
    .cabecalho input {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      background: #111111;
      color: #ffffff;
      border: 1px solid #d3d3d3;
      outline: none;
      padding: 0.3rem;
      width: 300px;
      border-radius: 4px;
    }
    .cabecalho button {
      background: none;
      border: none;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cabecalho button:hover {
      background: #ffffff;
      border-radius: 4px;
    }

    /* Colunas do Cabeçalho da Lista */
    .colunas-cabecalho {
      display: grid;
      grid-template-columns: 120px 3fr 60px 70px;
      gap: 1rem;
      padding: 0.75rem;
      background: #111111;
      border-bottom: 1px solid white;
      position: fixed;
      top: 2.75rem;
      left: 0;
      right: 0;
      z-index: 12;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
    }

    /* Container da Lista de Senhas */
    .lista-container {
      height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding: 5.5rem 0.75rem 0.75rem;
      background: #333333; /* Cinza escuro para o fundo da lista */
      position: relative;
      /* Esconde a barra de rolagem para navegadores baseados em WebKit (Chrome, Safari) */
      -ms-overflow-style: none;  /* Esconde a barra de rolagem para IE e Edge */
      scrollbar-width: none;  /* Esconde a barra de rolagem para Firefox */
    }

    /* Esconde a barra de rolagem para navegadores baseados em WebKit (Chrome, Safari) */
    .lista-container::-webkit-scrollbar {
      display: none;
    }

    .lista-senhas {
      width: 100%;
      margin-top: 0;
    }

    /* Item Individual da Senha */
    .item-senha {
      display: grid;
      grid-template-columns: 120px 3fr 60px 70px;
      gap: 1rem;
      align-items: center;
      padding: 6px 12px;
      border-bottom: 1px solid black; /* Azul claro para a borda entre as senhas */
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 0px; /* Espaçamento entre as senhas diminuído para 0px */
      background-color: #333333; /* Cinza escuro para o fundo do item da senha */
      transition: background-color 0.3s ease;
    }
    .item-senha.senha-encontrada {
      background: green !important;
      color: white !important;
      border-radius: 4px;
      font-weight: bold;
    }
    .item-senha span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-senha .senha span {
      background: none !important;
      color: inherit !important;
    }

    /* Estilo para os caracteres da senha */
    .caracteres {
      font-size: 0.8rem;
      color: #add8e6; /* Azul claro para o texto de caracteres */
      background: #000080; /* Azul escuro para o fundo de caracteres */
      text-align: center;
      border-radius: 4px;
      padding: 0.3rem;
    }
    .item-senha button {
      background: none;
      border: none;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .item-senha button:hover {
      background: #87ceeb; /* Azul claro para o hover do botão de copiar */
      border-radius: 4px;
    }

    /* Mensagem de Copiado */
    .copiado {
      color: #add8e6; /* Azul claro para a mensagem de copiado */
      font-size: 0.8rem;
      text-align: center;
    }
    .sentinela {
      height: 10px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <p>Carregando...</p>
  </div>
  <div class="cabecalho">
    Lista de Senhas | by Antonio Pedro ~ 2025
    <input type="text" placeholder="Buscar senha..." maxlength="32" id="entrada-busca">
    <button id="botao-anterior" title="Anterior">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d3d3d3" stroke-width="2">
        <path d="m18 15-6-6-6 6"/>
      </svg>
    </button>
    <button id="botao-proximo" title="Próximo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d3d3d3" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>
    <button id="botao-limpar" title="Limpar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d3d3d3" stroke-width="2">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
  <div class="colunas-cabecalho">
    <span class="coluna-id">Id</span>
    <span class="coluna-senha">Senha</span>
    <span class="coluna-caracteres">Chars</span>
    <span class="coluna-copiar">Copiar</span>
  </div>
  <div class="lista-container">
    <div class="lista-senhas" id="lista-senhas"></div>
    <div class="sentinela" id="sentinela"></div>
  </div>
