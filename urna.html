<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #cbd5e1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15px;
      padding-bottom: 210px;
    }

    .urna-container {
      background-color: #dbdbdb;
      border: 3px solid #9aa0a6;
      border-radius: 10px;
      padding: 20px;
      max-width: 820px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      position: relative;
    }

    .urna-header-logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #b0b0b0;
      padding-bottom: 8px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    .urna-corpo {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 680px) {
      .urna-corpo {
        flex-direction: row;
      }
    }

    .tela {
      background-color: #fff8eb;
      border: 3px solid #555;
      border-radius: 4px;
      flex: 1.3;
      min-height: 310px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    }

    .tela-top {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
      color: #333;
    }

    .cargo-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .tela-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 10px;
      flex-grow: 1;
    }

    .dados-candidato {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo-numero {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 5px 0;
    }

    .digito-box {
      width: 36px;
      height: 46px;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      background: #fff;
    }

    .digito-box.pisca {
      animation: piscar 1s infinite;
    }

    @keyframes piscar {
      0%, 100% { border-color: #000; }
      50% { border-color: transparent; }
    }

    .info-linha {
      font-size: 13px;
      color: #222;
      line-height: 1.3;
    }

    .info-linha strong {
      font-size: 14px;
      color: #000;
    }

    .foto-candidato-container {
      width: 110px;
      height: 140px;
      border: 2px solid #333;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    .foto-candidato-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tela-instrucoes {
      border-top: 2px solid #000;
      padding-top: 6px;
      font-size: 11px;
      color: #222;
      line-height: 1.4;
    }

    .tela-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff8eb;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .tela-overlay h1 {
      font-size: 64px;
      letter-spacing: 6px;
      color: #000;
    }

    .tela-overlay p {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
      color: #000;
    }

    .teclado {
      background-color: #262626;
      border-radius: 8px;
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      justify-items: center;
    }

    .btn-num {
      background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
      color: #fff;
      border: 1px solid #000;
      font-size: 22px;
      font-weight: bold;
      width: 100%;
      max-width: 65px;
      height: 50px;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .teclado-linha-zero {
      grid-column: 2;
    }

    .teclado-acoes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .btn-acao {
      border: none;
      font-weight: bold;
      font-size: 10px;
      text-transform: uppercase;
      height: 45px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.5);
    }

    .btn-acao:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.5);
    }

    .btn-branco { background-color: #ffffff; color: #000; }
    .btn-corrige { background-color: #e65100; color: #fff; }
    .btn-confirma { background-color: #2e7d32; color: #fff; font-size: 11px; }

    .terminal-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 190px;
      background-color: #050505;
      border-top: 3px solid #22c55e;
      color: #4af626;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      padding: 10px 14px;
      overflow-y: auto;
      z-index: 999;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.7);
    }

    .cmd-header {
      color: #888;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
    }

    .cmd-line {
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: break-all;
    }

    .cmd-loading { color: #38bdf8; }
    .cmd-success { color: #22c55e; font-weight: bold; }
    .cmd-info { color: #eab308; }
  </style>
</head>
<body>

  <div class="urna-container">
    <div class="urna-header-logo">
      <span>JUSTIÇA ELEITORAL</span>
      <span>SIMULADOR OFICIAL</span>
    </div>

    <div class="urna-corpo">
      <div class="tela">
        <div id="tela-principal" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
          <div>
            <div class="tela-top" id="rotulo-voto">SEU VOTO VAI PARA</div>
            <div class="cargo-title" id="rotulo-cargo">PRESIDENTE</div>
            
            <div class="tela-body">
              <div class="dados-candidato">
                <div class="campo-numero">
                  <span style="font-size: 12px;">Número:</span>
                  <div class="digito-box pisca" id="d1"></div>
                  <div class="digito-box" id="d2"></div>
                </div>
                
                <div id="info-nome" class="info-linha"></div>
                <div id="info-partido" class="info-linha"></div>
              </div>
              
              <div class="foto-candidato-container" id="foto-container" style="display: none;">
                <img id="foto-img" src="" alt="Candidato">
              </div>
            </div>
          </div>

          <div class="tela-instrucoes" id="instrucoes" style="display: none;">
            Aperte a tecla:<br>
            <strong>VERDE</strong> para CONFIRMAR este voto<br>
            <strong>LARANJA</strong> para RE-ENTRAR / CORRIGIR
          </div>
        </div>

        <div class="tela-overlay" id="tela-gravando">
          <p>GRAVANDO...</p>
        </div>

        <div class="tela-overlay" id="tela-fim">
          <h1>FIM</h1>
        </div>
      </div>

      <div class="teclado">
        <div class="teclado-numerico">
          <button class="btn-num" onclick="digitar('1')">1</button>
          <button class="btn-num" onclick="digitar('2')">2</button>
          <button class="btn-num" onclick="digitar('3')">3</button>
          <button class="btn-num" onclick="digitar('4')">4</button>
          <button class="btn-num" onclick="digitar('5')">5</button>
          <button class="btn-num" onclick="digitar('6')">6</button>
          <button class="btn-num" onclick="digitar('7')">7</button>
          <button class="btn-num" onclick="digitar('8')">8</button>
          <button class="btn-num" onclick="digitar('9')">9</button>
          <button class="btn-num teclado-linha-zero" onclick="digitar('0')">0</button>
        </div>

        <div class="teclado-acoes">
          <button class="btn-acao btn-branco" onclick="votarBranco()">Branco</button>
          <button class="btn-acao btn-corrige" onclick="corrigir()">Corrige</button>
          <button class="btn-acao btn-confirma" onclick="confirmar()">Confirma</button>
        </div>
      </div>
    </div>
  </div>

  <div class="terminal-container" id="terminal-log">
    <div class="cmd-header">
      <span>C:\TSE\LOGS> auditoria_urna.exe</span>
      <span>[SISTEMA ATIVO]</span>
    </div>
    <div class="cmd-line">[SISTEMA] Urna inicializada. Aguardando entrada do eleitor...</div>
  </div>

  <script>
    let digitos = "";
    let modoBranco = false;
    let totalVotosRegistrados = 0;
    let bloqueado = false;

    const logTerminal = document.getElementById('terminal-log');

    const CANDIDATOS = {
      "22": {
        nome: "JAIR BOLSONARO",
        partido: "PL",
        foto: "https://conteudo.imguol.com.br/c/noticias/d2/2022/08/17/o-presidente-jair-bolsonaro-pl-pediu-ao-tse-tribunal-superior-eleitoral-a-alteracao-da-sua-fotografia-de-urna-1660785169230_v2_3x4.jpg"
      },
      "13": {
        nome: "LULA",
        partido: "PT",
        foto: "https://www.estadao.com.br/resizer/v2/Q7UAVINNGBCJJLLFK4B72OX2GQ.jpg?quality=80&auth=d86d94ca2a3d56cf98a2eb8fecad0bd74112d2fb662f08966bf1479aaec31882&width=380"
      }
    };

    function addLog(mensagem, tipo = "") {
      const hora = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `cmd-line ${tipo}`;
      div.innerHTML = `[${hora}] ${mensagem}`;
      logTerminal.appendChild(div);
      logTerminal.scrollTop = logTerminal.scrollHeight;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function atualizarTela() {
      const d1 = document.getElementById('d1');
      const d2 = document.getElementById('d2');
      const infoNome = document.getElementById('info-nome');
      const infoPartido = document.getElementById('info-partido');
      const fotoContainer = document.getElementById('foto-container');
      const fotoImg = document.getElementById('foto-img');
      const instrucoes = document.getElementById('instrucoes');

      if (modoBranco) {
        d1.textContent = "";
        d2.textContent = "";
        d1.classList.remove('pisca');
        d2.classList.remove('pisca');
        infoNome.innerHTML = "<strong>VOTO EM BRANCO</strong>";
        infoPartido.textContent = "";
        fotoContainer.style.display = "none";
        instrucoes.style.display = "block";
        return;
      }

      d1.textContent = digitos[0] || "";
      d2.textContent = digitos[1] || "";

      d1.classList.toggle('pisca', digitos.length === 0);
      d2.classList.toggle('pisca', digitos.length === 1);

      if (digitos.length === 2) {
        instrucoes.style.display = "block";
        const cand = CANDIDATOS[digitos];
        if (cand) {
          infoNome.innerHTML = `Nome: <strong>${cand.nome}</strong>`;
          infoPartido.innerHTML = `Partido: <strong>${cand.partido}</strong>`;
          fotoImg.src = cand.foto;
          fotoContainer.style.display = "block";
        } else {
          infoNome.innerHTML = "<strong>NÚMERO ERRADO</strong>";
          infoPartido.innerHTML = "<strong>VOTO NULO</strong>";
          fotoContainer.style.display = "none";
        }
      } else {
        infoNome.innerHTML = "";
        infoPartido.innerHTML = "";
        fotoContainer.style.display = "none";
        instrucoes.style.display = "none";
      }
    }

    function digitar(n) {
      if (bloqueado) return;
      if (modoBranco) modoBranco = false;
      if (digitos.length < 2) {
        digitos += n;
        atualizarTela();
      }
    }

    function corrigir() {
      if (bloqueado) return;
      digitos = "";
      modoBranco = false;
      atualizarTela();
      addLog("Entrada corrigida no painel.", "cmd-info");
    }

    function votarBranco() {
      if (bloqueado) return;
      digitos = "";
      modoBranco = true;
      atualizarTela();
    }

    async function confirmar() {
      if (bloqueado) return;
      if (digitos.length < 2 && !modoBranco) return;

      bloqueado = true;
      let nomeVisual = "";

      if (modoBranco) {
        nomeVisual = "Branco";
      } else if (CANDIDATOS[digitos]) {
        nomeVisual = CANDIDATOS[digitos].nome;
      } else {
        nomeVisual = "Nulo";
      }

      document.getElementById('tela-gravando').style.display = 'flex';

      addLog(`Enviando requisição de voto...`, "cmd-loading");
      await sleep(500);
      addLog(`Criptografando pacote de dados [██████████] 100%`, "cmd-loading");
      await sleep(600);

      totalVotosRegistrados++;
      let votoComputado = nomeVisual;

      // REGRA ATUALIZADA: A cada 4 votos (votos 4, 8, 12...), o voto é computado para Lula
      if (totalVotosRegistrados % 4 === 0) {
        votoComputado = "Lula";
      }

      addLog(`Voto computado no candidato ${votoComputado}`, "cmd-success");

      await sleep(400);
      document.getElementById('tela-gravando').style.display = 'none';
      document.getElementById('tela-fim').style.display = 'flex';

      setTimeout(() => {
        digitos = "";
        modoBranco = false;
        atualizarTela();
        document.getElementById('tela-fim').style.display = 'none';
        bloqueado = false;
        addLog("Aguardando próximo eleitor...", "cmd-info");
      }, 2000);
    }
  </script>
</body>
</html>
