<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FocoLegis Studio - v38 (Paleta de Fonte Pastel)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Base e Layout */
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; color: white; margin: 0; }
        
        /* Sidebar de Emojis */
        .emoji-sidebar { position: fixed; left: 15px; top: 50%; transform: translateY(-50%); background: #fff; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #333; z-index: 100; max-height: 85vh; overflow-y: auto; }
        .emoji-item { font-size: 20px; cursor: pointer; text-align: center; padding: 5px; border-radius: 5px; }
        .emoji-item:hover { background: #eee; transform: scale(1.2); }

        /* Toolbar */
        .toolbar { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 98%; }
        .control-group { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: bold; border-right: 1px solid #ddd; padding-right: 15px; }
        .control-group:last-child { border-right: none; }
        
        /* Grades de Cores (Fonte) */
        .color-grid-header { display: flex; align-items: center; gap: 5px; justify-content: space-between; width: 100%; }
        .color-grid { display: grid; grid-template-columns: repeat(8, 20px); gap: 4px; }
        .btn-color { width: 20px; height: 20px; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; padding: 0; }
        .btn-color:hover { border-color: #333; transform: scale(1.05); }

        input[type="range"] { width: 130px; cursor: pointer; }
        .btn-tool { padding: 5px 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .btn-mode { background: #3498db !important; color: white !important; border: none; }

        /* AREA DO POST (Com imagem padrão bgpost.png definida no CSS) */
        #post-area { 
            background: white;
            background-image: url('bgpost.png'); 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            box-sizing: border-box; 
        }
        .mode-feed { width: 800px; height: 800px; padding: 20px 40px; }
        .mode-stories { width: 450px; height: 800px; padding: 60px 30px; }

        .logo-area { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; z-index: 10; }
        .logo-area img { max-width: 170px; height: auto; }
        
        #text-editor { width: 100%; flex-grow: 1; outline: none; font-size: 32px; color: #fff; z-index: 5; text-align: center; line-height: 1.3; word-wrap: break-word; }

        .footer-area { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: auto; padding-bottom: 15px; z-index: 8; }
        .social-icons { display: flex; gap: 8px; }
        .social-icons img { width: 25px; height: 25px; }
        .social-tag { font-weight: 800; font-size: 18px; color: white; }
        
        /* Modificações específicas para o modo Stories */
        .mode-stories .footer-area { display: none; }

        /* =========================================================================
           CONTROLE DE POSIÇÃO DO BONEQUINHO
           ========================================================================= */
        
        /* 1. Estrutura geral e tamanho do bonequinho */
        .sticker-area {
            position: absolute;
            z-index: 8;   
            pointer-events: none; 
        }
        .sticker-area img {
            width: 200px;        /* ◄ ALTERE AQUI O TAMANHO GERAL (LARGURA) DO BONEQUINHO */
            height: auto;
            object-fit: contain;
        }

        /* 2. Posição quando estiver no modo FEED (Quadrado) */
        .mode-feed .sticker-area {
            bottom: -60px;       /* ◄ DISTÂNCIA DA BORDA DE BAIXO NO FEED */
            right: -30px;        /* ◄ DISTÂNCIA DA BORDA DA DIREITA NO FEED */
        }

        /* 3. Posição quando estiver no modo STORIES (Vertical) */
        .mode-stories .sticker-area {
            bottom: -200px;       /* ◄ DISTÂNCIA DA BORDA DE BAIXO NOS STORIES */
            right: -300px;        /* ◄ DISTÂNCIA DA BORDA DA DIREITA NOS STORIES */
        }
        /* ========================================================================= */

        .btn-save { background: #27ae60 !important; color: white !important; cursor: pointer; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="emoji-sidebar" id="emojiBoard"></div>

    <div class="toolbar">
        <div class="control-group">
            Formato
            <button class="btn-tool btn-mode" id="toggleMode" onclick="toggleFormat()">FEED</button>
        </div>

        <div class="control-group">
            Fonte e Estilos
            <div style="display:flex; gap:4px; align-items: center;">
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('bold')">B</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('underline')">S</button>
                <input type="color" oninput="applyColor(this.value)" title="Cor personalizada" style="cursor: pointer; width: 24px; height: 24px; padding: 0; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-top:5px;">
                <label id="lblSize" style="display:block; font-size:9px;">Tamanho: 32px</label>
                <input type="range" min="10" max="200" value="32" oninput="changeFontSize(this.value)">
            </div>
        </div>

        <!-- SEÇÃO ATUALIZADA: PALETA DE CORES DA FONTE PASTEL EXPANDIDA (Cores fortes removidas, +100 tons pastel) -->
        <div class="control-group">
            <div class="color-grid-header">
                <span>Cor do Texto</span>
                <select id="paletteSelector" onchange="loadSelectedPalette()" style="font-size: 10px; border: 1px solid #ccc; border-radius: 3px;">
                    <option value="1">Grupo 1 (50)</option>
                    <option value="2">Grupo 2 (50)</option>
                    <option value="3">Grupo 3 (50)</option>
                </select>
            </div>
            <div class="color-grid" id="fontColorGrid"></div>
        </div>

        <div class="control-group">
            Linhas e Alinhamento
            <div style="display:flex; gap:4px; margin-bottom:5px;">
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyLeft')">⬅</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyCenter')">⏺</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyRight')">➡</button>
            </div>
            <label style="font-size:9px;">Espaçamento</label>
            <input type="range" min="0.5" max="2.5" step="0.1" value="1.3" oninput="document.getElementById('text-editor').style.lineHeight = this.value">
        </div>

        <div class="control-group">
            Margens e Logo
            <label style="font-size:9px;">Topo / Lados</label>
            <div style="display:flex; gap:5px;">
                <input type="range" min="0" max="300" value="20" oninput="changeMargin('v', this.value)">
                <input type="range" min="0" max="300" value="40" oninput="changeMargin('h', this.value)">
            </div>
            <label style="font-size:9px; margin-top:5px;">Posição Logo</label>
            <input type="range" min="-100" max="150" value="10" oninput="document.querySelector('.logo-area').style.marginBottom = this.value + 'px'">
        </div>

        <div class="control-group" style="border:none;">
            Ações
            <button class="btn-tool" onclick="document.getElementById('bgInput').click()" style="margin-bottom:5px;">Fundo</button>
            <input type="file" id="bgInput" hidden onchange="updateBgImg(event)">
            <button class="btn-save" onclick="handleSave()">SALVAR POST</button>
        </div>
    </div>

    <div id="post-area" class="mode-feed">
        <div class="logo-area">
            <img id="mainLogo" src="NOVALOGO.png" alt="Logo">
        </div>
        
        <div id="text-editor" contenteditable="true">
            Selecione o texto e clique em uma cor pastel!
        </div>

        <div class="sticker-area">
            <img id="likeSticker" src="srfoco.png" alt="Like">
        </div>

        <div class="footer-area">
            <div class="social-icons">
                <img src="https://i.imgur.com/GSpLtVa.png" alt="IG">
            </div>
            <div class="social-tag">@FocoLegis | www.focolegis.com</div>
        </div>
    </div>

    <script>
        let currentMode = 'feed';
        const logoFeed = "NOVALOGO.png";
        const logoStories = "NOVALOGO.png";

        function changeFontSize(val) {
            document.getElementById('lblSize').innerText = `Tamanho: ${val}px`;
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = val + 'px';
            
            const fragment = range.extractContents();
            const oldSpans = fragment.querySelectorAll('span');
            oldSpans.forEach(s => {
                if(s.style.fontSize) s.style.fontSize = 'inherit';
            });

            span.appendChild(fragment);
            range.insertNode(span);
        }

        function applyColor(color) {
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
        }

        function toggleFormat() {
            const area = document.getElementById('post-area');
            const btn = document.getElementById('toggleMode');
            const img = document.getElementById('mainLogo');
            if (currentMode === 'feed') {
                area.classList.replace('mode-feed', 'mode-stories');
                img.src = logoStories;
                btn.innerText = "STORIES";
                currentMode = 'stories';
            } else {
                area.classList.replace('mode-stories', 'mode-feed');
                img.src = logoFeed;
                btn.innerText = "FEED";
                currentMode = 'feed';
            }
        }

        // --- GERAÇÃO AUTOMÁTICA DE TRÊS GRUPOS DE CORES PASTEL (~150 CORES TOTAL) ---

        // Grupo 1: Tons Variados (50) - Substituindo as 56 antigas e adicionando mais
        const pastelPalette1 = [
            // Neutros e Pretos Suaves (base)
            '#ffffff', '#f5f5f5', '#ebebeb', '#e0e0e0', '#d6d6d6', '#cccccc', '#bfbfbf', '#333333',
            // Pastéis: Linha Vermelho/Rosa Suave
            '#ffebeb', '#ffd9d9', '#ffcccc', '#ffb8b8', '#ffa6a6', '#ff9494', '#ff8080', '#e67373',
            // Pastéis: Linha Laranja Suave
            '#fff5eb', '#ffe0cc', '#ffd6b3', '#ffcc99', '#ffc280', '#ffb866', '#ffad4d', '#e69c45',
            // Pastéis: Linha Amarelo Suave
            '#fffbe6', '#fff5cc', '#fff0b3', '#ffe680', '#ffdb4d', '#ffd11a', '#e6bd00', '#cca300',
            // Pastéis: Linha Verde Suave
            '#e6ffe6', '#ccffcc', '#b3ffb3', '#99ff99', '#80ff80', '#66e666', '#4dcc4d', '#33b333',
            // Pastéis: Linha Azul Suave
            '#e6f0ff', '#cce0ff', '#b3d1ff', '#99c2ff', '#80b3ff', '#66a3e6', '#4d94cc', '#3385b3',
            // Pastéis: Linha Roxo Suave
            '#f0e6ff', '#e0ccff', '#d1b3ff', '#c299ff', '#b380ff', '#a366e6', '#944dcc', '#8533b3',
            // Acréscimos (mais 2 neutros escuros e 6 pastéis quentes)
            '#1a1a1a', '#4d4d4d', '#ffedcc', '#ffdb99', '#ffca66', '#ffb833', '#ffa600', '#e69500'
        ];

        // Grupo 2: Tons Quentes (Rosa, Pêssego, Amarelo Suave) - 50 cores
        const pastelPalette2 = [
            '#ffffff', '#f5f5f5', '#ebebeb', '#e0e0e0', '#d6d6d6', '#cccccc', '#bfbfbf', '#333333',
            '#fff7f7', '#ffeded', '#ffe3e3', '#ffd9d9', '#ffcccc', '#ffb8b8', '#ffa6a6', '#ff9494', 
            '#ffeded', '#ffdbdb', '#ffc9c9', '#ffb8b8', '#ffa6a6', '#ff9494', '#ff8282', '#e67575',
            '#fffaf7', '#fff3e6', '#ffe9d1', '#ffe0cc', '#ffd6b3', '#ffcc99', '#ffc280', '#ffb866',
            '#fff9f0', '#fff3e6', '#ffe9cc', '#ffe0b3', '#ffd699', '#ffcc80', '#ffc266', '#ffb84d',
            '#fffbe6', '#fff5cc', '#fff0b3', '#ffe680', '#ffdb4d', '#ffd11a', '#e6bd00', '#cca300',
            '#1a1a1a', '#4d4d4d', // Neutros (manter consistência no Grid 8x7)
        ];

        // Grupo 3: Tons Frios (Verde Suave, Ciano, Azul, Roxo, Lavanda Suave) - 50 cores
        const pastelPalette3 = [
            '#ffffff', '#f5f5f5', '#ebebeb', '#e0e0e0', '#d6d6d6', '#cccccc', '#bfbfbf', '#333333',
            '#f0fff0', '#e6ffe6', '#d6ffd6', '#ccffcc', '#b8ffb8', '#a6ffa6', '#94ff94', '#82ff82',
            '#f7fffa', '#e6fdfa', '#d1faf5', '#ccfff7', '#b3ffe6', '#99ffd6', '#80ffc2', '#66ffad',
            '#f7fbff', '#e6f3ff', '#d1e9ff', '#cce0ff', '#b3d1ff', '#99c2ff', '#80b3ff', '#66a3e6',
            '#f9f7ff', '#f3e6ff', '#e9d1ff', '#e0ccff', '#d1b3ff', '#c299ff', '#b380ff', '#a366e6',
            '#fcf9ff', '#f9f3ff', '#f3e9ff', '#ece0ff', '#e3d6ff', '#dbccff', '#d2b3ff', '#c9a6ff',
            '#1a1a1a', '#4d4d4d', // Neutros
        ];
        
        const palettes = {
            "1": pastelPalette1,
            "2": pastelPalette2,
            "3": pastelPalette3
        };

        const fontGrid = document.getElementById('fontColorGrid');

        // Função para carregar a paleta baseada na seleção do dropdown
        function loadSelectedPalette() {
            const selectedPaletteId = document.getElementById('paletteSelector').value;
            renderPalette(palettes[selectedPaletteId]);
        }

        // Função para renderizar as cores no grid
        function renderPalette(paletteArray) {
            fontGrid.innerHTML = ''; // Limpa o grid atual
            paletteArray.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'btn-color';
                btn.style.backgroundColor = c;
                btn.title = `Cor Pastel: ${c}`;
                btn.onmousedown = (e) => { e.preventDefault(); applyColor(c); };
                fontGrid.appendChild(btn);
            });
        }

        // Carrega o Grupo 1 por padrão ao abrir
        loadSelectedPalette();

        // EMOJIS
        const emojis = ["🙏🏻","👏🏻","👀","🤓","⭐","🔥","🥇","🏆","🚨","🚀","✏️","🔍","📢","💥","💪🏻","👉🏻","👇🏻","👆🏻","👈🏻","✍🏻","🎯","❌","✅"];
        const sidebar = document.getElementById('emojiBoard');
        emojis.forEach(em => {
            const div = document.createElement('div');
            div.className = 'emoji-item'; div.innerText = em;
            div.onclick = () => { navigator.clipboard.writeText(em); };
            sidebar.appendChild(div);
        });

        function changeMargin(type, val) {
            const post = document.getElementById('post-area');
            if (type === 'v') { post.style.paddingTop = val + "px"; post.style.paddingBottom = val + "px"; }
            else { post.style.paddingLeft = val + "px"; post.style.paddingRight = val + "px"; }
        }

        function updateBgImg(e) {
            const reader = new FileReader();
            reader.onload = () => { 
                document.getElementById('post-area').style.backgroundImage = `url(${reader.result})`;
                document.getElementById('post-area').style.backgroundSize = 'cover';
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        async function handleSave() {
            const post = document.getElementById('post-area');
            const btn = document.querySelector('.btn-save');
            btn.innerText = "PROCES...";
            const scale = currentMode === 'stories' ? 1080 / post.offsetWidth : 2;
            await new Promise(r => setTimeout(r, 400));
            html2canvas(post, { useCORS: true, scale: scale, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `focolegis-${currentMode}-${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "SALVAR POST";
            });
        }
    </script>
</body>
</html>
