<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FocoLegis Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Base do site */
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; color: white; margin: 0; }
        
        /* Barra Lateral de Emojis */
        .emoji-sidebar { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); background: #fff; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #333; z-index: 100; }
        .emoji-item { font-size: 24px; cursor: pointer; text-align: center; padding: 5px; border-radius: 5px; }
        .emoji-item:hover { background: #eee; }

        /* Toolbar Superior */
        .toolbar { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .control-group { display: flex; flex-direction: column; gap: 8px; font-size: 11px; font-weight: bold; border-right: 1px solid #ddd; padding-right: 20px; }
        .control-group:last-child { border-right: none; }
        
        /* Estilo das Réguas */
        .range-group { display: flex; flex-direction: column; gap: 2px; }
        .range-group label { font-size: 9px; color: #666; }

        .btn-tool { padding: 5px 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }

        /* ÁREA DO POST 800x800 */
        #post-area { 
            width: 800px; height: 800px; 
            background: white; position: relative; 
            overflow: hidden; display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: flex-start; 
            box-sizing: border-box;
            /* Valores iniciais de margem */
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 40px;
            padding-right: 40px;
        }

        .logo-area { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; }
        .logo-area img { max-width: 170px; height: auto; pointer-events: none; }
        
        #text-editor { 
            width: 100%; flex-grow: 1; outline: none; 
            font-size: 32px; color: #000; z-index: 5; 
            text-align: center; line-height: 1.3;
        }

        .footer-area { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: auto; padding-bottom: 10px; }
        .social-icons { display: flex; gap: 8px; }
        .social-icons img { width: 32px; height: 32px; }
        .social-tag { font-weight: 800; font-size: 22px; color: #333; }

        .btn-save { background: #27ae60 !important; color: white !important; cursor: pointer; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="emoji-sidebar">
        <div class="emoji-item" onclick="copyEmoji('⚖️')">⚖️</div>
        <div class="emoji-item" onclick="copyEmoji('📖')">📖</div>
        <div class="emoji-item" onclick="copyEmoji('🚨')">🚨</div>
        <div class="emoji-item" onclick="copyEmoji('🎯')">🎯</div>
        <div class="emoji-item" onclick="copyEmoji('✅')">✅</div>
        <div class="emoji-item" onclick="copyEmoji('➡️')">➡️</div>
    </div>

    <div class="toolbar">
        <div class="control-group">
            Formatação
            <div>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('bold')">B</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('italic')">I</button>
                <input type="color" oninput="document.execCommand('foreColor', false, this.value)">
            </div>
            <div style="display:flex; gap:3px;">
                <button class="btn-tool" style="background:#b2fab4" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#b2fab4')"> </button>
                <button class="btn-tool" style="background:#97ecf0" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#97ecf0')"> </button>
                <button class="btn-tool" style="background:#c59fcc" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#c59fcc')"> </button>
                <button class="btn-tool" style="background:#cf8c5d" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#cf8c5d')"> </button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, 'transparent')">❌</button>
            </div>
        </div>

        <div class="control-group">
            Tamanho da Fonte (1-10)
            <select class="btn-tool" onchange="forceFontSize(this.value)">
                <option value="14px">1</option>
                <option value="18px">2</option>
                <option value="24px">3</option>
                <option value="32px">4</option>
                <option value="40px" selected>5</option>
                <option value="52px">6</option>
                <option value="68px">7</option>
                <option value="85px">8</option>
                <option value="110px">9</option>
                <option value="140px">10</option>
            </select>
        </div>

        <div class="control-group">
            Réguas (Margens)
            <div class="range-group">
                <label>Topo</label>
                <input type="range" min="0" max="250" value="20" oninput="changeMargin('top', this.value)">
            </div>
            <div class="range-group">
                <label>Lados</label>
                <input type="range" min="0" max="250" value="40" oninput="changeMargin('sides', this.value)">
            </div>
            <div class="range-group">
                <label>Base</label>
                <input type="range" min="0" max="200" value="20" oninput="changeMargin('bottom', this.value)">
            </div>
        </div>

        <div class="control-group">
            Ações
            <button class="btn-tool" onclick="document.getElementById('bgInput').click()">Mudar Fundo</button>
            <input type="file" id="bgInput" hidden onchange="updateBgImg(event)">
            <button class="btn-save" onclick="handleSave()">Salvar PNG</button>
        </div>
    </div>

    <div id="post-area">
        <div class="logo-area">
            <img src="https://i.imgur.com/RKYXdCJ.png" alt="Logo">
        </div>
        <div id="text-editor" contenteditable="true">
            90% ERRA ISSO NAS PROVAS!
        </div>
        <div class="footer-area">
            <div class="social-icons">
                <img src="https://i.imgur.com/GSpLtVa.png" alt="Insta">
                <img src="https://i.imgur.com/jkajxFs.png" alt="X">
            </div>
            <div class="social-tag">@FocoLegis</div>
        </div>
    </div>

    <script>
        // CORREÇÃO: Função de margem que realmente funciona
        function changeMargin(type, val) {
            const post = document.getElementById('post-area');
            if (type === 'top') post.style.paddingTop = val + "px";
            if (type === 'bottom') post.style.paddingBottom = val + "px";
            if (type === 'sides') {
                post.style.paddingLeft = val + "px";
                post.style.paddingRight = val + "px";
            }
        }

        // CORREÇÃO: Função de fonte 1-10 funcional
        function forceFontSize(pxSize) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            
            const range = selection.getRangeAt(0);
            const span = document.createElement("span");
            span.style.fontSize = pxSize;
            span.style.lineHeight = "1.1";
            
            if (!selection.isCollapsed) {
                span.appendChild(range.extractContents());
                range.insertNode(span);
            }
        }

        function copyEmoji(emoji) {
            navigator.clipboard.writeText(emoji);
        }

        function updateBgImg(e) {
            const reader = new FileReader();
            reader.onload = () => {
                const area = document.getElementById('post-area');
                area.style.backgroundImage = `url(${reader.result})`;
                area.style.backgroundSize = 'cover';
                area.style.backgroundPosition = 'center';
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        // CORREÇÃO: Função de salvar com tratamento de erro e delay
        async function handleSave() {
            const post = document.getElementById('post-area');
            const btn = document.querySelector('.btn-save');
            
            btn.innerText = "Processando...";
            
            // Pequeno delay para o navegador renderizar as margens
            await new Promise(r => setTimeout(r, 500));

            html2canvas(post, {
                useCORS: true,
                scale: 2, // Alta qualidade
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'focolegis-' + Date.now() + '.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "Salvar PNG";
            }).catch(err => {
                alert("Erro ao salvar. Tente usar o Chrome.");
                btn.innerText = "Salvar PNG";
            });
        }
    </script>
</body>
</html>
