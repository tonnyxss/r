<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FocoLegis Studio - v26</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Configurações de exibição do site */
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; color: white; margin: 0; }
        
        /* Sidebar de Emojis Lateral */
        .emoji-sidebar { position: fixed; left: 15px; top: 50%; transform: translateY(-50%); background: #fff; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #333; z-index: 100; max-height: 90vh; overflow-y: auto; }
        .emoji-item { font-size: 20px; cursor: pointer; text-align: center; padding: 5px; border-radius: 5px; transition: 0.2s; }
        .emoji-item:hover { background: #eee; transform: scale(1.2); }

        /* Toolbar Superior */
        .toolbar { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 95%; max-width: 1400px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; font-size: 11px; font-weight: bold; border-right: 1px solid #ddd; padding-right: 20px; }
        .control-group:last-child { border-right: none; }
        
        /* Tabela de Cores de Grifo */
        .color-grid { display: grid; grid-template-columns: repeat(8, 20px); gap: 4px; }
        .btn-color { width: 20px; height: 20px; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; padding: 0; }

        /* Sliders de ajuste */
        .range-group { display: flex; flex-direction: column; gap: 2px; }
        .range-group label { font-size: 9px; color: #666; margin-bottom: 2px; }
        input[type="range"] { width: 130px; cursor: pointer; }

        .btn-tool { padding: 6px 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; font-size: 12px; }

        /* QUADRADO DO POST (800x800) */
        #post-area { 
            width: 800px; height: 800px; 
            background: white; position: relative; 
            overflow: hidden; display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: flex-start; 
            box-sizing: border-box;
            padding: 20px 40px; /* Margens iniciais */
        }

        .logo-area { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; z-index: 10; }
        .logo-area img { max-width: 170px; height: auto; pointer-events: none; }
        
        /* O EDITOR DE TEXTO */
        #text-editor { 
            width: 100%; flex-grow: 1; outline: none; 
            font-size: 32px; color: #000; z-index: 5; 
            text-align: center; 
            line-height: 1.3; /* Ajustado globalmente pelo slider */
            word-wrap: break-word;
        }

        /* Rodapé social */
        .footer-area { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: auto; padding-bottom: 15px; z-index: 10; }
        .social-icons img { width: 32px; height: 32px; margin: 0 4px; }
        .social-tag { font-weight: 800; font-size: 20px; color: #333; }

        .btn-save { background: #27ae60 !important; color: white !important; cursor: pointer; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="emoji-sidebar" id="emojiBoard"></div>

    <div class="toolbar">
        <div class="control-group">
            Formatação Seletiva
            <div style="display:flex; gap:4px;">
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('bold')">B</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('italic')">I</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('underline')">S</button>
                <input type="color" oninput="applySelectionStyle('color', this.value)" title="Cor da Letra">
            </div>
            <div class="range-group">
                <label>Tamanho da Fonte (Seleção)</label>
                <input type="range" min="12" max="150" value="32" oninput="applySelectionStyle('fontSize', this.value + 'px')">
            </div>
        </div>

        <div class="control-group">
            Espaçamento Global
            <div style="display:flex; gap:4px; margin-bottom:5px;">
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyLeft')">⬅</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyCenter')">⏺</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyRight')">➡</button>
            </div>
            <div class="range-group">
                <label>Altura entre Linhas (Post Todo)</label>
                <input type="range" min="0.5" max="2.5" step="0.1" value="1.3" oninput="document.getElementById('text-editor').style.lineHeight = this.value">
            </div>
        </div>

        <div class="control-group">
            Tabela de Grifos (32 Cores)
            <div class="color-grid" id="colorGrid"></div>
        </div>

        <div class="control-group">
            Margens e Logo
            <div class="range-group">
                <label>Topo / Laterais</label>
                <div style="display:flex; gap:5px;">
                    <input type="range" min="0" max="300" value="20" oninput="changeMargin('v', this.value)" title="Topo/Base">
                    <input type="range" min="0" max="300" value="40" oninput="changeMargin('h', this.value)" title="Laterais">
                </div>
            </div>
            <div class="range-group">
                <label>Aproximar Texto da Logo</label>
                <input type="range" min="-100" max="150" value="10" oninput="document.querySelector('.logo-area').style.marginBottom = this.value + 'px'">
            </div>
        </div>

        <div class="control-group" style="border:none;">
            Ações
            <button class="btn-tool" onclick="document.getElementById('bgInput').click()" style="margin-bottom:5px;">Mudar Fundo</button>
            <input type="file" id="bgInput" hidden onchange="updateBgImg(event)">
            <button class="btn-save" onclick="handleSave()">SALVAR PNG</button>
        </div>
    </div>

    <div id="post-area">
        <div class="logo-area">
            <img src="https://i.imgur.com/RKYXdCJ.png" alt="Logo">
        </div>
        <div id="text-editor" contenteditable="true">
            
        </div>
        <div class="footer-area">
            <div class="social-icons">
                <img src="https://i.imgur.com/GSpLtVa.png" alt="IG">
                <img src="https://i.imgur.com/jkajxFs.png" alt="X">
            </div>
            <!-- RODAPÉ ATUALIZADO AQUI -->
            <div class="social-tag">@FocoLegis | www.focolegis.com</div>
        </div>
    </div>

    <script>
        // Cores e Emojis
        const colors = [
            '#bfe0ff','#a9d4ff','#82caff','#3399ff','#c8f7c5','#b8f0c2','#7cfc00','#228b22',
            '#fff3a6','#fff7bf','#ffd966','#ffcc00','#ffd1a6','#ffc48c','#ffb347','#ff8c00',
            '#ffc1d6','#ffcadc','#f498ad','#ff1493','#dcc6ff','#d2b8ff','#c08dfa','#9400d3',
            '#c2fff0','#c2f0ff','#e6ffc2','#ffd9c2','#ffffff','#f0f0f0','#d3d3d3','#000000'
        ];
        
        const grid = document.getElementById('colorGrid');
        colors.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'btn-color'; btn.style.backgroundColor = c;
            // ATUALIZADO: Chama a função inteligente de grifo
            btn.onmousedown = (e) => { e.preventDefault(); applyHighlight(c); };
            grid.appendChild(btn);
        });

        const emojis = ["🙏🏻","👏🏻","👀","🤓","⭐","🔥","🥇","🏆","🚨","🚀","✏️","🔍","📢","💥","💪🏻","👉🏻","👇🏻","👆🏻","👈🏻","✍🏻","🎯","❌","✅"];
        const sidebar = document.getElementById('emojiBoard');
        emojis.forEach(em => {
            const div = document.createElement('div');
            div.className = 'emoji-item'; div.innerText = em;
            div.onclick = () => { navigator.clipboard.writeText(em); };
            sidebar.appendChild(div);
        });

        // FORMATAÇÃO INTELIGENTE DO GRIFO (Correção do Caixotão Azul)
        function applyHighlight(color) {
            document.execCommand('styleWithCSS', false, true);
            if (!document.execCommand('hiliteColor', false, color)) {
                document.execCommand('backColor', false, color);
            }
            
            const editor = document.getElementById('text-editor');
            
            // Remove a cor da <div> inteira se o navegador errar
            const blocos = editor.querySelectorAll('div, p');
            blocos.forEach(bloco => {
                if (bloco.style.backgroundColor) {
                    const cor = bloco.style.backgroundColor;
                    bloco.style.backgroundColor = ''; 
                    bloco.innerHTML = `<span style="background-color: ${cor};">${bloco.innerHTML}</span>`;
                }
            });

            // Adiciona o visual "Marca-Texto" aos spans grifados
            const spans = editor.querySelectorAll('span');
            spans.forEach(span => {
                if (span.style.backgroundColor && span.style.backgroundColor !== 'transparent' && span.style.backgroundColor !== 'rgba(0, 0, 0, 0)') {
                    span.style.padding = "2px 8px";
                    span.style.borderRadius = "6px";
                    span.style.webkitBoxDecorationBreak = "clone";
                    span.style.boxDecorationBreak = "clone";
                }
            });
        }

        // Formatação Seletiva (Apenas Cor e Tamanho)
        function applySelectionStyle(property, value) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement("span");
            if (property === 'color') span.style.color = value;
            if (property === 'fontSize') span.style.fontSize = value;
            span.appendChild(range.extractContents());
            range.insertNode(span);
        }

        // Margens do Quadrado
        function changeMargin(type, val) {
            const post = document.getElementById('post-area');
            if (type === 'v') { post.style.paddingTop = val + "px"; post.style.paddingBottom = val + "px"; }
            else { post.style.paddingLeft = val + "px"; post.style.paddingRight = val + "px"; }
        }

        // Fundo
        function updateBgImg(e) {
            const reader = new FileReader();
            reader.onload = () => { 
                const area = document.getElementById('post-area');
                area.style.backgroundImage = `url(${reader.result})`;
                area.style.backgroundSize = 'cover'; area.style.backgroundPosition = 'center';
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        // Salvar em PNG (v26)
        async function handleSave() {
            const post = document.getElementById('post-area');
            const btn = document.querySelector('.btn-save');
            btn.innerText = "PROCESSANDO...";
            await new Promise(r => setTimeout(r, 400));
            html2canvas(post, { 
                useCORS: true, 
                scale: 2, 
                backgroundColor: "#ffffff",
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'focolegis-post-' + Date.now() + '.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "SALVAR PNG";
            });
        }
    </script>
</body>
</html>
