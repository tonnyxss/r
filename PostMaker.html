<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FocoLegis Studio - v17</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* CSS com comentários explicativos */
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; color: white; margin: 0; }
        
        /* Barra de Emojis Lateral */
        .emoji-sidebar { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); background: #fff; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto; color: #333; z-index: 100; }
        .emoji-sidebar h4 { margin: 0 0 10px 0; font-size: 12px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .emoji-item { font-size: 24px; cursor: pointer; padding: 5px; text-align: center; border-radius: 5px; transition: background 0.2s; }
        .emoji-item:hover { background: #f0f0f0; transform: scale(1.1); }

        /* Toolbar Superior */
        .toolbar { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .control-group { display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: bold; border-right: 1px solid #ddd; padding-right: 20px; min-width: 160px; }
        .control-group:last-child { border-right: none; }
        .btn-tool { padding: 5px 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .btn-tool:hover { background: #ddd; }

        /* Área do Post (800x800) */
        #post-area { width: 800px; height: 800px; background: white; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px; box-sizing: border-box; }
        .logo-area { width: 100%; display: flex; justify-content: center; margin-bottom: -15px; } /* Sobe o texto para perto da logo */
        .logo-area img { max-width: 170px; height: auto; }
        
        /* Editor de Texto */
        #text-editor { width: 100%; flex-grow: 1; outline: none; font-size: 30px; color: #000; z-index: 5; display: block; text-align: center; padding: 0px 15px; line-height: 1.2; }

        /* Rodapé */
        .footer-area { display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 5; width: 100%; padding-bottom: 5px; margin-top: auto; }
        .social-icons { display: flex; gap: 8px; }
        .social-icons img { width: 32px; height: 32px; object-fit: contain; }
        .social-tag { font-weight: 800; font-size: 22px; color: #333; }

        /* Botão de Salvar */
        .btn-save { background: #27ae60 !important; color: white !important; cursor: pointer; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="emoji-sidebar">
        <h4>Símbolos</h4>
        <div class="emoji-item" onclick="copyEmoji('⚖️')">⚖️</div>
        <div class="emoji-item" onclick="copyEmoji('📖')">📖</div>
        <div class="emoji-item" onclick="copyEmoji('🚨')">🚨</div>
        <div class="emoji-item" onclick="copyEmoji('💡')">💡</div>
        <div class="emoji-item" onclick="copyEmoji('🎯')">🎯</div>
        <div class="emoji-item" onclick="copyEmoji('✅')">✅</div>
        <div class="emoji-item" onclick="copyEmoji('⚠️')">⚠️</div>
        <div class="emoji-item" onclick="copyEmoji('➡️')">➡️</div>
        <div class="emoji-item" onclick="copyEmoji('🔥')">🔥</div>
    </div>

    <div class="toolbar">
        <div class="control-group">
            Estilos
            <div>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('bold')">B</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('italic')"><i>I</i></button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('underline')"><u>S</u></button>
            </div>
        </div>

        <div class="control-group">
            Tamanho e Cor
            <div>
                <select class="btn-tool" onchange="changeFontSize(this.value)">
                    <option value="16px">1</option>
                    <option value="22px">2</option>
                    <option value="28px">3</option>
                    <option value="36px">4</option>
                    <option value="42px" selected>5</option>
                    <option value="54px">6</option>
                    <option value="70px">7</option>
                    <option value="90px">8</option>
                    <option value="110px">9</option>
                    <option value="130px">10</option>
                </select>
                <input type="color" oninput="document.execCommand('foreColor', false, this.value)">
            </div>
        </div>

        <div class="control-group">
            Marca-Texto
            <div style="display:flex; gap:5px;">
                <button class="btn-tool" style="background:#b2fab4" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#b2fab4')"> </button>
                <button class="btn-tool" style="background:#fff9c4" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, '#fff9c4')"> </button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('hiliteColor', false, 'transparent')">❌</button>
            </div>
        </div>

        <div class="control-group">
            Alinhamento
            <div>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyLeft')">⬅ Esq</button>
                <button class="btn-tool" onmousedown="event.preventDefault(); document.execCommand('justifyCenter')">⏺ Centro</button>
            </div>
        </div>

        <div class="control-group">
            Ações
            <div style="display:flex; gap:5px;">
                <input type="file" id="bgInput" hidden onchange="updateBgImg(event)">
                <button class="btn-tool" onclick="document.getElementById('bgInput').click()">Mudar Fundo</button>
                <button class="btn-save" onclick="savePng()">Download .PNG</button>
            </div>
        </div>
    </div>

    <div id="post-area">
        <div class="logo-area">
            <img src="https://i.imgur.com/RKYXdCJ.png" alt="Logo">
        </div>
        <div id="text-editor" contenteditable="true">
            90% ERRA ISSO NAS PROVAS!
        </div>
        <div class="footer-area">
            <div class="social-icons">
                <img id="icon-insta" src="https://i.imgur.com/GSpLtVa.png" alt="">
                <img id="icon-x" src="https://i.imgur.com/jkajxFs.png" alt="">
            </div>
            <div class="social-tag">@FocoLegis</div>
        </div>
    </div>

    <script>
        function copyEmoji(emoji) {
            navigator.clipboard.writeText(emoji);
        }

        function changeFontSize(size) {
            document.execCommand('styleWithCSS', false, true);
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                document.execCommand('fontSize', false, '7');
                const fonts = document.getElementById('text-editor').querySelectorAll('font[size="7"]');
                fonts.forEach(f => {
                    f.removeAttribute('size');
                    f.style.fontSize = size;
                });
            }
        }

        function updateBgImg(e) {
            const reader = new FileReader();
            reader.onload = () => {
                const area = document.getElementById('post-area');
                area.style.backgroundImage = `url(${reader.result})`;
                area.style.backgroundSize = 'cover';
                area.style.backgroundPosition = 'center';
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        // Função de download robusta
        function savePng() {
            const post = document.getElementById('post-area');
            
            // Força o carregamento visual antes do print
            html2canvas(post, {
                useCORS: true, 
                allowTaint: true,
                scale: 2,
                logging: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'post-focolegis-' + Date.now() + '.png';
                link.href = image;
                link.click();
            }).catch(err => {
                console.error("Erro ao gerar imagem: ", err);
                alert("Erro ao gerar imagem. Tente usar o navegador Chrome.");
            });
        }
    </script>
</body>
</html>
