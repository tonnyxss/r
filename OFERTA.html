<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ética - OAB 46</title>
    
    <!-- Pixel da Meta (Facebook/Instagram) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1974259026792087');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1974259026792087&ev=PageView&noscript=1"/></noscript>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #1a252f; color: #ffffff; text-align: center; padding: 40px 20px; }
        header h1 { margin: 0; font-size: 2.2em; color: #f1c40f; }
        .container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .card { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 35px; text-align: center; }
        .card-img-container { width: 180px; height: 180px; margin: 0 auto 20px; background-color: #ecf0f1; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-download { background-color: #27ae60; color: white; text-decoration: none; padding: 18px 25px; border-radius: 5px; font-weight: bold; display: block; transition: 0.3s; font-size: 1.1em; border: none; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn-download.disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-download:hover:not(.disabled) { background-color: #219653; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .modal-content h3 { margin-top: 0; color: #1a252f; }
        .modal-content input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #ecf0f1; border-radius: 5px; font-size: 1em; box-sizing: border-box; }
        #link-real { display: none; margin-top: 20px; background-color: #2c3e50; }
        footer { text-align: center; padding: 40px; color: #7f8c8d; }
    </style>
</head>
<body>

    <header>
        <h1>Foco Legis</h1>
        <p>Acelere sua aprovação na OAB!</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-img-container"><img src="OAB.png" alt="Capa"></div>
            <h3>Resumão Ética Profissional - OAB 46</h3>
            <p>O conteúdo essencial de Ética para gabaritar na 1ª fase.</p>
            <div class="area-botoes">
                <button class="btn-download disabled" id="btn-timer">AGUARDE 10s...</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>Quase lá! 🚀</h3>
            <p id="modal-text">Informe seu WhatsApp para liberar o download gratuito.</p>
            <form id="whatsapp-form">
                <input type="tel" id="whatsapp-input" placeholder="(00) 90000-0000" required>
                <button type="submit" class="btn-download" id="btn-liberar">LIBERAR ACESSO</button>
            </form>
            <a href="OAB46.pdf" target="_blank" class="btn-download" id="link-real">CLIQUE PARA BAIXAR PDF</a>
        </div>
    </div>

    <footer><p>&copy; 2026 Foco Legis.</p></footer>

<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw0H50s38jUfAXmmal9zotsFwWgqHPTkQgWCDTNoD7V1TB018JzXTBmLdoSMvIrEQ/exec';
        
        // 1. CAPTURAR IP, LOCALIZAÇÃO, DISPOSITIVO E UTM AUTOMATICAMENTE
        let utmsUrl = window.location.search;
        if (!utmsUrl) utmsUrl = "Orgânico/Direto";

        let ua = navigator.userAgent;
        let deviceType = "PC";
        let osType = "Outro";

        if (/Mobile|Android|iP(hone|od|ad)/i.test(ua)) { deviceType = "Celular"; }

        if (/Android/i.test(ua)) { osType = "Android"; } 
        else if (/iP(hone|od|ad)/i.test(ua)) { osType = "iOS"; } 
        else if (/Windows/i.test(ua)) { osType = "Windows"; } 
        else if (/Mac/i.test(ua)) { osType = "MacOS"; }

        // --- RASTREADOR COMBO: PEGA IPv4 LIMPO + GEOLOCALIZAÇÃO ---
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(ipData => {
                let ipLimpo = ipData.ip; // Pega o IP no formato clássico (IPv4)
                
                // Agora descobre a cidade e o estado desse IP limpo
                fetch('https://ipapi.co/' + ipLimpo + '/json/')
                    .then(res => res.json())
                    .then(geoData => {
                        fetch(scriptURL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({ 
                                "type": "ip", 
                                "ip": ipLimpo,
                                "estado": geoData.region || "-",
                                "cidade": geoData.city || "-",
                                "page": "OFERTA",
                                "utm": utmsUrl,
                                "device": deviceType,
                                "os": osType
                            })
                        });
                    });
            }).catch(e => console.log("Erro rastreio:", e));

        // 2. LÓGICA DO TIMER E MODAL
        const btnTimer = document.getElementById('btn-timer');
        const modal = document.getElementById('modal');
        const form = document.getElementById('whatsapp-form');
        const linkReal = document.getElementById('link-real');
        const inputWhatsapp = document.getElementById('whatsapp-input');
        const modalText = document.getElementById('modal-text');
        const btnLiberar = document.getElementById('btn-liberar');

        let timeLeft = 10;
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) { btnTimer.innerText = `AGUARDE ${timeLeft}s...`; } 
            else { clearInterval(timer); btnTimer.innerText = 'BAIXAR MATERIAL AGORA'; btnTimer.classList.remove('disabled'); }
        }, 1000);

        // EVENTO: Ao clicar para abrir o Modal
        btnTimer.addEventListener('click', () => { 
            if (!btnTimer.classList.contains('disabled')) {
                modal.style.display = 'flex'; 
                if (typeof fbq === 'function') {
                    fbq('trackCustom', 'OpenModal', { content_name: 'Resumão Ética Profissional' });
                }
            }
        });

        // 3. ENVIO DO WHATSAPP (COM CORRESPONDÊNCIA AVANÇADA)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const whats = inputWhatsapp.value;
            
            if(whats.length >= 10) {
                btnLiberar.innerText = "PROCESSANDO...";
                btnLiberar.classList.add('disabled');
                
                // --- INÍCIO: CORRESPONDÊNCIA AVANÇADA META ---
                let numeroLimpo = whats.replace(/\D/g, ''); // Tira tudo que não é número
                if (!numeroLimpo.startsWith('55')) {
                    numeroLimpo = '55' + numeroLimpo; // Coloca o +55 do Brasil
                }

                if (typeof fbq === 'function') {
                    fbq('set', '1974259026792087', {
                        ph: numeroLimpo 
                    });
                }
                // --- FIM: CORRESPONDÊNCIA AVANÇADA META ---

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ "type": "whatsapp", "whatsapp": whats })
                }).then(() => {
                    form.style.display = 'none'; 
                    modalText.innerHTML = "<b style='color: #27ae60'>✅ Acesso Liberado!</b><br>Clique no botão abaixo.";
                    linkReal.style.display = 'block'; 
                    
                    // EVENTO: Lead Validado!
                    if (typeof fbq === 'function') {
                        fbq('track', 'Lead', { content_name: 'Resumão Ética Profissional' });
                    }
                });
            } else {
                alert("Por favor, insira um número válido com DDD.");
            }
        });

        // EVENTO: Ao clicar para baixar o PDF
        linkReal.addEventListener('click', () => { 
            if (typeof fbq === 'function') {
                fbq('trackCustom', 'DownloadMaterial', { content_name: 'Resumão Ética Profissional' });
            }
            setTimeout(() => { window.location.href = "https://www.focolegis.com"; }, 4000); 
        });

        // Fechar Modal
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
</script>
</body>
</html>
