    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #1a252f; color: #ffffff; text-align: center; padding: 40px 20px; }
        header h1 { margin: 0; font-size: 2.2em; color: #f1c40f; }
        .container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .card { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 35px; text-align: center; }
        .card-img-container { width: 180px; height: 180px; margin: 0 auto 20px; background-color: #ecf0f1; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-download { background-color: #27ae60; color: white; text-decoration: none; padding: 18px 25px; border-radius: 5px; font-weight: bold; display: block; transition: 0.3s; font-size: 1.1em; border: none; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn-download.disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-download:hover:not(.disabled) { background-color: #219653; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .modal-content h3 { margin-top: 0; color: #1a252f; }
        .modal-content input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #ecf0f1; border-radius: 5px; font-size: 1em; box-sizing: border-box; }
        #link-real { display: none; margin-top: 20px; background-color: #2c3e50; }
        footer { text-align: center; padding: 40px; color: #7f8c8d; }
    </style>
</head>
<body>

    <header>
        <h1>Foco Legis</h1>
        <p>Acelere sua aprovação na OAB!</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-img-container"><img src="OAB.png" alt="Capa"></div>
            <h3>Resumão Ética Profissional - OAB 46</h3>
            <p>O conteúdo essencial de Ética para gabaritar na 1ª fase.</p>
            <div class="area-botoes">
                <button class="btn-download disabled" id="btn-timer">AGUARDE 10s...</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>Quase lá! 🚀</h3>
            <p id="modal-text">Informe seu WhatsApp para liberar o download gratuito.</p>
            <form id="whatsapp-form">
                <input type="tel" id="whatsapp-input" placeholder="(00) 90000-0000" required>
                <button type="submit" class="btn-download" id="btn-liberar">LIBERAR ACESSO</button>
            </form>
            <a href="OAB46.pdf" target="_blank" class="btn-download" id="link-real">CLIQUE PARA BAIXAR PDF</a>
        </div>
    </div>

    <footer><p>&copy; 2026 Foco Legis.</p></footer>

<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwwFhzM59TtiGmkx_vC1hvpiHB3pv0nKMd2aGND0_d9g-MT5xOZrVhs7bwStYGJq9xx/exec';
        
        // 1. CAPTURAR IP AUTOMATICAMENTE NESTA PÁGINA (COM ORIGEM)
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ "type": "ip", "ip": data.ip, "page": "OFERTA" })
                });
            }).catch(e => console.log(e));

        // 2. LÓGICA DO TIMER E MODAL
        const btnTimer = document.getElementById('btn-timer');
        const modal = document.getElementById('modal');
        const form = document.getElementById('whatsapp-form');
        const linkReal = document.getElementById('link-real');
        const inputWhatsapp = document.getElementById('whatsapp-input');
        const modalText = document.getElementById('modal-text');
        const btnLiberar = document.getElementById('btn-liberar');

        let timeLeft = 10;
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) { btnTimer.innerText = `AGUARDE ${timeLeft}s...`; } 
            else { clearInterval(timer); btnTimer.innerText = 'BAIXAR MATERIAL AGORA'; btnTimer.classList.remove('disabled'); }
        }, 1000);

        btnTimer.addEventListener('click', () => { if (!btnTimer.classList.contains('disabled')) modal.style.display = 'flex'; });

        // 3. ENVIO DO WHATSAPP
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const whats = inputWhatsapp.value;
            if(whats.length >= 10) {
                btnLiberar.innerText = "PROCESSANDO...";
                btnLiberar.classList.add('disabled');
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ "type": "whatsapp", "whatsapp": whats })
                }).then(() => {
                    form.style.display = 'none'; 
                    modalText.innerHTML = "<b style='color: #27ae60'>✅ Acesso Liberado!</b><br>Clique no botão abaixo.";
                    linkReal.style.display = 'block'; 
                });
            }
        });

        linkReal.addEventListener('click', () => { setTimeout(() => { window.location.href = "https://www.focolegis.com"; }, 4000); });
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
    </script>
</body>
</html>
