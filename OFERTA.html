    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #1a252f;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.2em;
            color: #f1c40f;
        }
        header p {
            font-size: 1.1em;
            margin-top: 10px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 35px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .card-tag {
            background-color: #27ae60;
            color: white;
            font-size: 0.85em;
            padding: 5px 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
            align-self: center;
            text-transform: uppercase;
        }
        .card-img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            overflow: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
        }
        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card h3 {
            margin: 10px 0;
            color: #2c3e50;
            font-size: 1.5em;
        }
        .card p {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .btn-download {
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            border-radius: 5px;
            font-weight: bold;
            display: block;
            transition: background-color 0.3s;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
        }
        /* Estilo para quando o botão está desativado */
        .btn-download.disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-download:hover:not(.disabled) { background-color: #219653; }

        footer { text-align: center; padding: 40px 20px; color: #7f8c8d; }
    </style>
</head>
<body>

    <header>
        <h1>Foco Legis</h1>
        <p>Acelere sua aprovação na OAB!</p>
    </header>

    <div class="container">
        <div class="card">
            <span class="card-tag">Material Gratuito 🎁</span>
            <div class="card-img-container">
                <img src="OAB.png" alt="Resumão Ética Profissional">
            </div>
            <h3>Resumão Ética Profissional - OAB 46</h3>
            <p>O conteúdo essencial de Ética esquematizado para gabaritar na 1ª fase.</p>
            
            <div class="area-botoes">
                <a href="OAB46.pdf" target="_blank" class="btn-download disabled" id="download-btn">
                    AGUARDE 10s...
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Foco Legis. Todos os direitos reservados.</p>
    </footer>

    <script>
        const btn = document.getElementById('download-btn');
        let timeLeft = 10;

        // Função do Timer
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                btn.innerText = `AGUARDE ${timeLeft}s...`;
            } else {
                clearInterval(timer);
                btn.innerText = 'BAIXAR MATERIAL AGORA';
                btn.classList.remove('disabled');
            }
        }, 1000);

        // Lógica de Redirecionamento após o clique
        btn.addEventListener('click', function(e) {
            if (!btn.classList.contains('disabled')) {
                setTimeout(function() {
                    window.location.href = "https://www.focolegis.com";
                }, 2000);
            }
        });
    </script>
</body>
