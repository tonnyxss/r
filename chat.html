function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatMessage(text) {
    return text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<strong>$1</strong>');
}

function getTime() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function appendMessage(text, side, isTyping = false) {
    const div = document.createElement('div');
    div.className = `message ${side} ${isTyping ? 'typing' : ''}`;
    if (isTyping) {
        div.innerHTML = '<span></span><span></span><span></span>';
        div.id = 'typing-indicator';
    } else {
        const safe = side === 'sent' ? escapeHtml(text) : text;
        div.innerHTML = `${formatMessage(safe)} <span class="message-time">${getTime()}</span>`;
    }
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
}

function sendBotMessage(text, delay = 1400) {
    chatStatus.innerText = 'Digitando...';
    const typing = appendMessage('', 'received', true);
    setTimeout(() => {
        typing.remove();
        appendMessage(text, 'received');
        chatStatus.innerText = 'Online';
    }, delay);
}

// Envia uma lista de mensagens em sequência (ordem garantida) e, ao final, executa "done"
function sayAll(list, done) {
    let i = 0;
    (function next() {
        if (i >= list.length) { if (done) done(); return; }
        const text = list[i++];
        const d = Math.min(900 + text.length * 8, 2600);
        sendBotMessage(text, d);
        setTimeout(next, d + 250);
    })();
}

function appendOptions(options) {
    const container = document.createElement('div');
    container.className = 'options-container';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => { container.remove(); opt.action(); };
        container.appendChild(btn);
    });
    chatContainer.appendChild(container);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function appendLinkButton(text, url) {
    const a = document.createElement('a');
    a.className = 'btn-link';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerText = text;
    chatContainer.appendChild(a);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function appendPdfAttachment(displayName, fileUrl) {
    const wrap = document.createElement('div');
    wrap.className = 'message received';
    wrap.style.padding = '6px';
    const a = document.createElement('a');
    a.className = 'pdf-attachment';
    a.href = fileUrl;
    a.setAttribute('download', displayName);
    a.innerHTML = `<div class="pdf-icon">📄</div><div class="pdf-details"><div class="pdf-name">${displayName}</div><div class="pdf-meta">PDF • Toque para baixar</div></div>`;
    const time = document.createElement('span');
    time.className = 'message-time';
    time.innerHTML = getTime();
    wrap.appendChild(a);
    wrap.appendChild(time);
    chatContainer.appendChild(wrap);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function copiarTexto(texto, onOk, onFail) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(onOk).catch(() => copiarFallback(texto, onOk, onFail));
    } else {
        copiarFallback(texto, onOk, onFail);
    }
}

function copiarFallback(texto, onOk, onFail) {
    try {
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? onOk() : onFail();
    } catch (e) { onFail(); }
}

function enableFreeText(placeholder) {

// Normaliza: minúsculas, sem acentos, sem pontuação, com espaço nas pontas
function norm(text) {
    return ' ' + text.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ').trim() + ' ';
}

// Procura palavras/expressões INTEIRAS. Termo terminado em "*" = prefixo (ex.: "concurs*")
function has(m, terms) {
    return terms.some(t => t.endsWith('*') ? m.includes(' ' + t.slice(0, -1)) : m.includes(' ' + t + ' '));
}

function shortMsg(m, max) { return m.trim().split(' ').length <= max; }

function careerReply(icon, titulo, texto1, texto2) {
    sayAll([`${icon} *${titulo}* ${texto1}`, texto2], voltarMenu);
}

let lastUserText = '';

function responderTextoLivre(text) {
    lastUserText = text;
    const m = norm(text);
    for (const intent of intents) {
        if (intent.test(m)) { intent.run(); return; }
    }
    // Fallback: não entendi → humano
    sayAll(['Entendi! Para essa dúvida específica, o melhor é falar com nosso atendimento — um atendente humano resolve na hora:'], () => {
        irParaSuporteWpp();
    });
}

// ── ENGINE ───────────────────────────────────────────────────────────────────

function selectOption(chosenText, nextState) {
    appendMessage(chosenText, 'sent');
    setTimeout(() => {
        if (nextState === 'RESET') {
            disableInput();
            sendBotMessage(`Voltamos ao início, *${userData.name}*! Como posso te ajudar?`, 1000);
            setTimeout(() => { showMainMenu(); }, 1800);
        } else {
            currentState = nextState;
            if (chatFlow[currentState] && chatFlow[currentState].execute) {
                chatFlow[currentState].execute();
            }
        }
    }, 600);
}

function handleUserSend() {
    if (userInput.disabled) return;
    const text = userInput.value.trim();
    if (!text) return;
    appendMessage(text, 'sent');
    userInput.value = '';
    setTimeout(() => {
        if (currentState === 'WAITING_FOR_NAME') {
            chatFlow.WAITING_FOR_NAME.handle(text);
        } else if (currentState === 'WAITING_FOR_FREE_TEXT') {
            disableInput('Aguardando resposta...');
            chatFlow.HUMAN_SUPPORT.handle(text);
        }
    }, 500);
}

sendBtn.addEventListener('click', handleUserSend);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserSend(); });
window.onload = () => { chatFlow.START.execute(); };
